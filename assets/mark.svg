<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Divings — CCA-F Interactive Guide">
  <!-- Divings guide mark — "the crossing".
       Designed on the Paper canvas (Divings Design System → 03 Guide mark →
       "Guide mark — making it specific", concept H3) and exported from there;
       Paper is the source, this file is the export. Re-export rather than
       hand-editing, then run: node scripts/build-icons.js

       An orb crossing a waterline. Above the line it is solid; below it, it is
       offset sideways and dissolved into contour — because that is what water
       does to anything you look at through it. The break at the waterline is
       the mark. It reads the hero story: what is under the surface is not
       where you expect it to be.

       Field System: safety #E23B12 ground, steel #141413 water, white orb.
       No gradient, no glow, square corners.

       The refracted contour is WHITE, not safety orange. Orange on steel is
       3.9:1 — fine as a large graphic, but at 16px a 1.6px line lands on half
       a pixel and the submerged half collapses into a brown smear. White is
       16.6:1 and survives the downscale. Four heavier lines rather than six
       thin ones for the same reason. -->
  <defs>
    <clipPath id="orb"><circle cx="32" cy="30" r="22"/></clipPath>
    <clipPath id="orbRefracted"><circle cx="37" cy="31" r="21"/></clipPath>
  </defs>

  <rect width="64" height="64" fill="#E23B12"/>
  <rect y="34" width="64" height="30" fill="#141413"/>

  <g clip-path="url(#orb)">
    <rect width="64" height="34" fill="#FFFFFF"/>
  </g>

  <g clip-path="url(#orbRefracted)" fill="none" stroke="#FFFFFF" stroke-width="2.4">
    <path d="M0 36.5h64"/>
    <path d="M0 41h64"/>
    <path d="M0 45h64"/>
    <path d="M0 48.5h64"/>
  </g>
</svg>
