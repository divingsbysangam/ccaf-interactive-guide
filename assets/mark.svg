<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Divings — CCA-F Interactive Guide">
  <!-- Divings Field System mark. The v1 "journey constellation" (dark radial
       gradients, blue/gold glow, 14px radius) is retired with the particle
       identity; the idea it carried — steps rising — survives, restated in
       Field System form: one hot signal, square corners, no gradient, no glow.

       Drawn as ONE connected staircase silhouette rather than five separate
       bars on purpose. Five 6px bars with 2px gaps disappear into mush at a
       16px favicon; a solid form with notched corners keeps its shape all the
       way down. The five steps live on the Journey Map, where they can be
       read; the tab icon only has to say "Divings, and something is rising".

       Every coordinate is a multiple of 4, so at 16px (÷4) and 32px (÷2) each
       edge lands on a whole pixel and the mark rasterises crisp instead of
       fringing. Regenerate the PNGs with: node scripts/build-icons.js -->
  <rect width="64" height="64" fill="#E23B12"/>
  <path fill="#FFFFFF" d="M8 52V40h16V28h16V16h16v36z"/>
</svg>
